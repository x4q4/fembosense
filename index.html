<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEMBOSENSE — CS2 Software</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' x2='100%25' y1='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='100%25' stop-color='%23b7b7b7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%23000000'/%3E%3Crect x='16' y='12' width='10' height='40' rx='4' fill='url(%23g)'/%3E%3Crect x='16' y='12' width='30' height='10' rx='4' fill='url(%23g)'/%3E%3Crect x='16' y='28' width='26' height='10' rx='4' fill='url(%23g)'/%3E%3Crect x='16' y='46' width='18' height='6' rx='3' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card-bg: #080808;
      --card-hover: #121212;
      --border: #1f1f1f;
      --border-bright: #ffffff;
      --text: #ffffff;
      --text-dim: #777777;
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновая тонкая сетка */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }

    header {
      position: sticky;
      top: 16px;
      z-index: 100;
      padding: 0 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 100px;
      gap: 12px;
    }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .logo-text span { color: var(--text-dim); }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .btn-telegram {
      background: linear-gradient(135deg, #ffffff 0%, #d9d9d9 100%);
      color: #000000;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
      animation: tgPulse 2s ease-in-out infinite;
    }

    @keyframes tgPulse {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.12);
      }
      50% {
        transform: translateY(-2px);
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.28);
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      background: #0d0d0d;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 16px;
      border-radius: 100px;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
    }

    /* HERO */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 120px 20px 60px;
    }

    .version-tag {
      background: #0d0d0d;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 100px;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .release-status {
      display: inline-block;
      margin-bottom: 18px;
      padding: 10px 22px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
      animation: releaseBlink 1.8s ease-in-out infinite;
    }

    @keyframes releaseBlink {
      0%, 100% {
        opacity: 0.7;
        transform: scale(1);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.08);
      }
      50% {
        opacity: 1;
        transform: scale(1.04);
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.22);
      }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 20px;
      color: #ffffff;
      text-transform: uppercase;
      word-break: break-word;
    }

    .hero-title {
      display: inline-block;
      background: linear-gradient(90deg, #ffffff 0%, #d9d9d9 20%, #ffffff 40%, #9ca3af 60%, #ffffff 80%, #d9d9d9 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: title-shimmer 3s linear infinite, title-float 3s ease-in-out infinite;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.18);
    }

    @keyframes title-shimmer {
      0% { background-position: 0% 50%; filter: brightness(1); }
      50% { background-position: 100% 50%; filter: brightness(1.2); }
      100% { background-position: 0% 50%; filter: brightness(1); }
    }

    @keyframes title-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 16px;
      max-width: 580px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .hero-btns {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 320px;
      justify-content: center;
    }

    .btn-primary {
      background: #ffffff;
      color: #000000;
      padding: 16px 40px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    .btn-primary:hover {
      background: #e6e6e6;
      transform: translateY(-2px);
    }

    /* SECTIONS */
    section {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 20px;
    }

    /* FAQ */
    .faq-list {
      max-width: 750px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .faq-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.2s;
    }

    .faq-question {
      width: 100%;
      text-align: left;
      padding: 20px 24px;
      background: none;
      border: none;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease, padding 0.2s;
      padding: 0 24px;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.6;
    }

    .faq-item.active .faq-answer {
      max-height: 200px;
      padding-bottom: 20px;
    }

    .faq-icon {
      transition: transform 0.2s;
      font-size: 18px;
      color: #fff;
    }

    .faq-item.active .faq-icon {
      transform: rotate(45deg);
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 13px;
    }

    /* АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
    @media (max-width: 768px) {
      header {
        top: 10px;
        padding: 0 10px;
      }

      nav {
        padding: 10px 16px;
        border-radius: 20px;
        flex-wrap: wrap;
        justify-content: space-between;
      }

      .logo-text {
        font-size: 16px;
      }

      .nav-links {
        gap: 16px;
      }

      .nav-links a {
        font-size: 13px;
      }

      .status-badge {
        font-size: 10px;
        padding: 4px 10px;
      }

      .hero {
        padding: 80px 16px 40px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 28px;
      }

      .release-status {
        font-size: 10px;
        padding: 8px 16px;
        letter-spacing: 1.5px;
      }
    }

    @media (max-width: 480px) {
      nav {
        gap: 8px;
      }

      .status-badge {
        width: 100%;
        justify-content: center;
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo-text">FEMBO<span>SENSE</span></div>
      <div class="nav-links">
        <a href="#faq">FAQ</a>
        <a href="https://t.me/fembosense" target="_blank">Telegram</a>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div> UNDETECTED
      </div>
    </nav>
  </header>

  <section class="hero">
    <div class="version-tag">CS2 SOFTWARE</div>
    <div class="release-status">ЕЩЁ НЕ ВЫШЛА</div>
    <h1 class="hero-title">FEMBOSENSE</h1>
    <p class="subtitle">Приватное ПО премиум-уровня. Максимальная плавность, анонимность и мгновенный обход VACnet.</p>
    <div class="hero-btns">
      <a href="https://t.me/x4q4z" target="_blank" class="btn-primary btn-telegram">Связаться в TG</a>
    </div>
  </section>

  <script>
    function toggleFaq(button) {
      const item = button.parentElement;
      item.classList.toggle('active');
    }
  </script>

</body>
</html>
